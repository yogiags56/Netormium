name: Import Netormium RC20 baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-rc20.yml"
      - "scripts/import_rc20.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netormium-rc20-import
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify and extract RC20 source
        run: python scripts/import_rc20.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Gateway tests
        working-directory: gateway
        run: npm test

      - name: Run release consistency checks
        working-directory: gateway
        run: npm run check:release

      - name: Check Ant project definition
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          ant -projecthelp

      - name: Commit extracted RC20 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import Netormium 1.0 RC20 source baseline"
          git push origin HEAD:main
