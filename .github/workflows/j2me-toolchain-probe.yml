name: Netormium Java ME Toolchain Probe

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/j2me-toolchain-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-midlet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned Java ME API stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          curl --fail --location --retry 3 --output toolchain/cldcapi11.jar https://repo.maven.apache.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          curl --fail --location --retry 3 --output toolchain/midpapi20.jar https://repo.maven.apache.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
          jar tf toolchain/cldcapi11.jar | grep -Fx 'javax/microedition/io/Connector.class'
          jar tf toolchain/midpapi20.jar | grep -Fx 'javax/microedition/midlet/MIDlet.class'
          jar tf toolchain/midpapi20.jar | grep -Fx 'javax/microedition/lcdui/Canvas.class'

      - name: Download legacy Eclipse ECJ 3.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          curl --fail --location --retry 3 --output toolchain/ecj-3.7.2.jar https://repo.maven.apache.org/maven2/org/eclipse/jdt/core/compiler/ecj/3.7.2/ecj-3.7.2.jar
          jar tf toolchain/ecj-3.7.2.jar | grep -E 'org/eclipse/jdt/internal/compiler/batch/Main.class'
          java -cp toolchain/ecj-3.7.2.jar org.eclipse.jdt.internal.compiler.batch.Main -help > toolchain/ecj-help.txt 2>&1 || true

      - name: Compile all MIDlet sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes
          find src -name '*.java' -print0 | xargs -0 java -cp toolchain/ecj-3.7.2.jar org.eclipse.jdt.internal.compiler.batch.Main \
            -1.3 -encoding UTF-8 \
            -bootclasspath toolchain/cldcapi11.jar:toolchain/midpapi20.jar \
            -d build/classes
          test -n "$(find build/classes -name '*.class' -print -quit)"
          find build/classes -name '*.class' | sort > toolchain/compiled-classes.txt
          echo "Compiled class count: $(wc -l < toolchain/compiled-classes.txt)"

      - name: Preverify and package MIDlet with ProGuard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          curl --fail --location --retry 3 --output toolchain/proguard-7.10.0.zip https://github.com/Guardsquare/proguard/releases/download/v7.10.0/proguard-7.10.0.zip
          echo "5aa88c434766a057a2ead3412acc01022bb444f9f1bfbae690a1d48b2006b242  toolchain/proguard-7.10.0.zip" | sha256sum --check
          unzip -q toolchain/proguard-7.10.0.zip -d toolchain/proguard
          PROGUARD_DIR="$(find toolchain/proguard -type f -name proguard.sh -print -quit | xargs -r dirname)"
          test -n "$PROGUARD_DIR"
          jar --create --file build/Netormium-unverified.jar -C build/classes .
          APP_VERSION="$(node -p "require('./gateway/package.json').version")"
          printf 'Manifest-Version: 1.0\r\nMIDlet-Name: Netormium\r\nMIDlet-Version: %s\r\nMIDlet-Vendor: Netormium Project\r\nMIDlet-1: Netormium,,com.netormium.client.NetormiumMIDlet\r\nMIDlet-Permissions: javax.microedition.io.Connector.http, javax.microedition.io.Connector.https\r\nMicroEdition-Profile: MIDP-2.0\r\nMicroEdition-Configuration: CLDC-1.1\r\n\r\n' "$APP_VERSION" > toolchain/Netormium-MANIFEST.MF
          cat > toolchain/netormium.pro <<EOF
          -injars $GITHUB_WORKSPACE/build/Netormium-unverified.jar
          -outjars $GITHUB_WORKSPACE/dist/Netormium.jar
          -libraryjars $GITHUB_WORKSPACE/toolchain/cldcapi11.jar
          -libraryjars $GITHUB_WORKSPACE/toolchain/midpapi20.jar
          -dontshrink
          -dontoptimize
          -dontobfuscate
          -microedition
          -verbose
          -keep class ** { *; }
          EOF
          echo "ProGuard executable: $PROGUARD_DIR/proguard.sh"
          echo "Java runtime: $(java -version 2>&1 | head -n 1)"
          set +e
          "$PROGUARD_DIR/proguard.sh" @toolchain/netormium.pro 2>&1 | tee toolchain/proguard.log
          PROGUARD_STATUS=${PIPESTATUS[0]}
          set -e
          echo "ProGuard exit code: $PROGUARD_STATUS"
          if [ "$PROGUARD_STATUS" -ne 0 ]; then
            echo "ProGuard diagnostics (last 200 lines):"
            tail -n 200 toolchain/proguard.log
            exit "$PROGUARD_STATUS"
          fi
          set -x
          test -s dist/Netormium.jar
          mkdir -p build/preverified
          (cd build/preverified && jar xf ../../dist/Netormium.jar)
          rm -rf build/preverified/META-INF
          jar --create --file dist/Netormium.jar --manifest toolchain/Netormium-MANIFEST.MF -C build/preverified .
          unzip -p dist/Netormium.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'MIDlet-Name: Netormium'
          unzip -p dist/Netormium.jar META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'MicroEdition-Profile: MIDP-2.0'
          jar tf dist/Netormium.jar | grep -Fx 'com/netormium/client/NetormiumMIDlet.class'
          if jar tf dist/Netormium.jar | grep -q '^javax/microedition/'; then
            echo "Java ME API classes must not be bundled in MIDlet JAR" >&2
            exit 1
          fi
          cp resources/Netormium.jad.example dist/Netormium.jad
          JAR_SIZE="$(wc -c < dist/Netormium.jar | tr -d ' ')"
          sed -i "s/^MIDlet-Jar-Size: .*/MIDlet-Jar-Size: $JAR_SIZE/" dist/Netormium.jad
          node gateway/scripts/check-midlet-package.js dist/Netormium.jar dist/Netormium.jad

      - name: Upload Alpha JAR and JAD
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netormium-alpha-midlet-package
          path: |
            dist/Netormium.jar
            dist/Netormium.jad
          if-no-files-found: error

      - name: Archive compile-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netormium-alpha-compile-probe
          path: |
            toolchain/ecj-help.txt
            toolchain/compiled-classes.txt
            toolchain/proguard.log
            toolchain/netormium.pro
            dist/Netormium.jar
            dist/Netormium.jad
          if-no-files-found: warn
