name: Netormium validation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Run gateway unit tests
        working-directory: gateway
        run: node --test test/*.test.js
      - name: Check release identity
        working-directory: gateway
        run: node scripts/check-release.js
      - name: Check Ant project
        run: ant -projecthelp
