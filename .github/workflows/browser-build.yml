name: Netormium Browser Build

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "src/**"
      - "build.xml"
      - "build.properties.example"
      - ".github/workflows/browser-build.yml"
  workflow_dispatch:
    inputs:
      run_java_me_release:
        description: "Run genuine Java ME release gate (requires SDK APIs, ECJ and preverifier configured as repository variables)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Prepare diagnostic directory
        run: mkdir -p browser-build-report

      - name: Gateway tests
        working-directory: gateway
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../browser-build-report/gateway-tests.log

      - name: Release consistency
        working-directory: gateway
        shell: bash
        run: |
          set -o pipefail
          npm run check:release 2>&1 | tee ../browser-build-report/release-consistency.log

      - name: Ant project diagnostics
        run: ant -projecthelp

      - name: Archive non-blocking toolchain diagnostic
        if: always()
        run: |
          mkdir -p browser-build-report
          java -version 2> browser-build-report/java-version.txt
          node --version > browser-build-report/node-version.txt
          ant -version > browser-build-report/ant-version.txt
          ant doctor > browser-build-report/ant-doctor.txt 2>&1 || true

      - name: Upload source validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netormium-browser-validation
          path: browser-build-report/
          if-no-files-found: warn

  java-me-release:
    if: ${{ inputs.run_java_me_release }}
    runs-on: ubuntu-latest
    env:
      CLDC_API_JAR: ${{ vars.CLDC_API_JAR }}
      MIDP_API_JAR: ${{ vars.MIDP_API_JAR }}
      PREVERIFY: ${{ vars.PREVERIFY }}
      ECJ_JAR: ${{ vars.ECJ_JAR }}
      NETORMIUM_COMPILER: ecj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Require externally provisioned Java ME toolchain
        shell: bash
        run: |
          set -euo pipefail
          for name in CLDC_API_JAR MIDP_API_JAR PREVERIFY ECJ_JAR; do
            value="${!name:-}"
            test -n "$value" || { echo "$name repository variable is not configured"; exit 2; }
            test -e "$value" || { echo "$name path does not exist on the hosted runner: $value"; exit 2; }
          done
          test -f "$CLDC_API_JAR"
          test -f "$MIDP_API_JAR"
          test -f "$ECJ_JAR"
          test -x "$PREVERIFY"

      - name: Configure and validate Java ME toolchain
        shell: bash
        run: |
          set -euo pipefail
          cat > build.properties <<EOF
          cldc.api.jar=$CLDC_API_JAR
          midp.api.jar=$MIDP_API_JAR
          preverify.executable=$PREVERIFY
          compiler.backend=ecj
          ecj.jar=$ECJ_JAR
          EOF
          ant doctor

      - name: Build and validate MIDlet JAR/JAD
        run: ant -propertyfile build.properties clean release

      - name: Upload MIDlet package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netormium-midlet-jar-jad
          path: |
            dist/*.jar
            dist/*.jad
          if-no-files-found: error
